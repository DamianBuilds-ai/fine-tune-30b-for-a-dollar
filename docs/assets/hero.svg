<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Fine-tune a 30B model for $0.96 - QLoRA on a rented A100, merged to GGUF, served on CPU with Ollama">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="1184" height="324" rx="22" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="8" y="8" width="1184" height="6" rx="3" fill="url(#accent)"/>

  <text x="56" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3" fill="#64748b">REPRODUCIBLE BUILD  ·  FAILURES INCLUDED</text>

  <text x="54" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#f8fafc">Fine-tune a 30B model for <tspan fill="#34d399">$0.96</tspan></text>

  <text x="56" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#94a3b8">QLoRA on a rented A100  ›  merged to GGUF  ›  served on CPU with Ollama</text>

  <!-- stat tiles: 270px pitch, last tile clears the right edge -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="56"  y="206" width="3" height="78" rx="1.5" fill="#34d399"/>
    <text x="76"  y="246" font-size="36" font-weight="700" fill="#e2e8f0">$0.96</text>
    <text x="76"  y="272" font-size="15" fill="#64748b">total GPU cost (v2 run)</text>

    <rect x="326" y="206" width="3" height="78" rx="1.5" fill="#22d3ee"/>
    <text x="346" y="246" font-size="36" font-weight="700" fill="#e2e8f0">33 min</text>
    <text x="346" y="272" font-size="15" fill="#64748b">A100 training time</text>

    <rect x="596" y="206" width="3" height="78" rx="1.5" fill="#818cf8"/>
    <text x="616" y="246" font-size="36" font-weight="700" fill="#e2e8f0">18 GB</text>
    <text x="616" y="272" font-size="15" fill="#64748b">GGUF Q4_K_M merged</text>

    <rect x="866" y="206" width="3" height="78" rx="1.5" fill="#f472b6"/>
    <text x="886" y="246" font-size="36" font-weight="700" fill="#e2e8f0">~13 tok/s</text>
    <text x="886" y="272" font-size="15" fill="#64748b">CPU inference, no GPU</text>
  </g>

  <text x="56" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#475569">base: Qwen3-30B-A3B-Instruct-2507  ·  MoE ~3B active params  ·  eval loss 0.076  ·  Apache-2.0</text>
</svg>
